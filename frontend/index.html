<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>JEDIDA Marketplace</title>

    <meta
      name="description"
      content="JEDIDA Marketplace — buy, sell and grow. From agriculture to everyday goods."
    />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=GT-NCG4B8PV"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());

      gtag("config", "GT-NCG4B8PV");
    </script>

    <!-- Google Identity Services -->
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      href="/favicon-32.png"
      sizes="32x32"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0B3D24"
    />

    <!-- iOS PWA -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="JEDIDA"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- React/Vite entry point -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>

    <!-- Service Worker / PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .catch((error) => {
              console.warn(
                "JEDIDA service worker registration failed:",
                error
              );
            });
        });
      }
    </script>
  </body>
</html>
