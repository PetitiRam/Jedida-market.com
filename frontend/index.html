<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JEDIDA Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="description" content="JEDIDA Marketplace — buy, sell and grow. From agriculture to everyday goods." />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Installability: manifest + icons. Real, working today — no build
         pipeline needed. Chrome/Edge on Android and desktop will offer an
         "Install app" prompt once the manifest + service worker are both
         present (see sw.js registration below). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B3D24" />
    <!-- iOS ignores the web manifest for "Add to Home Screen" — these tags
         are what make it install as a standalone app there instead of
         opening Safari every time. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JEDIDA" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Non-fatal: the site works fine without it, it just won't be
            // installable / won't show the offline fallback page.
          });
        });
      }
    </script>
  </body>
</html>
