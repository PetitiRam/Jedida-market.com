<!DOCTYPE html>
<html><head><meta charset="UTF-8" />
<style>
  html, body { height: 100%; margin: 0; background: #0B3D24; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: 'Sora', sans-serif; }
  .word { color: #F6FBF7; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
  .word span { color: #8BC53F; }
  .spinner {
    width: 28px; height: 28px; margin-top: 18px;
    border: 3px solid rgba(251,246,236,0.25); border-top-color: #8BC53F;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style></head>
<body>
  <div class="word">JEDIDA <span>Marketplace</span></div>
  <div class="spinner"></div>
</body></html>
